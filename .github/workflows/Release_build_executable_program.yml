name: 自动构建并发布可执行文件

on:
  release:
    types: [ published ]

permissions:
  contents: write
  discussions: write

jobs:
  build:
    name: 构建于 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    env:
      PYTHONUTF8: "1"

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            executable: dist/XHS-Downloader/XHS-Downloader.exe
            artifact: XHS-Downloader_Windows_X64

          - os: windows-11-arm
            executable: dist/XHS-Downloader/XHS-Downloader.exe
            artifact: XHS-Downloader_Windows_ARM64

          - os: macos-15-intel
            executable: dist/XHS-Downloader/XHS-Downloader
            artifact: XHS-Downloader_macOS_X64

          - os: macos-latest
            executable: dist/XHS-Downloader/XHS-Downloader
            artifact: XHS-Downloader_macOS_ARM64

    steps:
      - name: 签出存储库
        uses: actions/checkout@v4

      - name: 设置 uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: 安装依赖项
        run: |
          uv python install 3.12
          uv sync --frozen --no-dev --no-install-project --python 3.12
          uv pip install cx_Freeze

      - name: 构建可执行文件
        run: uv run --no-sync python setup.py build_exe --build-exe dist/XHS-Downloader

      - name: 验证可执行文件
        run: >-
          uv run --no-sync python -c
          "import subprocess; subprocess.run([r'${{ matrix.executable }}', '--version'], check=True)"

      - name: 创建压缩包
        run: |
          7z a "XHS-Downloader_V${{ github.event.release.tag_name }}_${{ matrix.artifact }}.zip" ./dist/XHS-Downloader/*
        shell: bash

      - name: 上传文件到 release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./XHS-Downloader_V*.zip
          name: XHS-Downloader V${{ github.event.release.tag_name }}
          body_path: ./static/Release_Notes.md
          draft: ${{ github.event.release.draft }}
          prerelease: ${{ github.event.release.prerelease }}
